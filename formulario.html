<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Espera - Vane Zapata</title>
    <style>
      :root {
        --wine: #6B2737;
        --cream: #FAF6F1;
        --blush: #E8D3C7;
        --f-body: sans-serif;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: var(--f-body);
        background: transparent;
        color: var(--cream);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .waitlist-form { 
        width: 100%;
        max-width: 460px; 
        display: flex; 
        flex-direction: column; 
        gap: 1rem; 
      }
      .waitlist-form input {
        width: 100%; 
        padding: 1rem 1.2rem; 
        border-radius: 999px;
        border: 1px solid rgba(250,246,241,.4); 
        background: rgba(250,246,241,.08);
        color: var(--cream); 
        font-family: var(--f-body); 
        font-size: 1rem;
        box-sizing: border-box;
      }
      .waitlist-form input::placeholder {
        color: rgba(250, 246, 241, 0.88);
        opacity: 1;
      }
      .waitlist-form input:focus {
        outline: none;
        border-color: var(--blush);
        background: rgba(250,246,241,.12);
      }
      .waitlist-form button { 
        margin-top: .4rem; 
        padding: 1rem 1.2rem;
        border-radius: 999px;
        border: none;
        background: var(--cream); 
        color: var(--wine); 
        font-weight: 700; 
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      .waitlist-form button:hover { 
        background: var(--blush); 
        color: var(--wine); 
      }
      .waitlist-form__status { 
        font-size: .9rem; 
        min-height: 1.2em; 
        text-align: center;
        color: var(--cream);
        margin-top: 5px;
      }
    </style>
</head>
<body>
    <form class="waitlist-form" id="waitlistForm">
      <input type="text" id="nombre" name="nombre" placeholder="Nombre y Apellido" required autocomplete="name">
      <input type="email" id="email" name="email" placeholder="Correo electrónico" required autocomplete="email">
      <button type="submit" class="btn">Quiero mi lugar</button>
      <p class="waitlist-form__status" id="formStatus" role="status"></p>
    </form>

    <script>
       const WAITLIST_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzyPYZQRZcKK4a8vad2cEmGpPKkN3Y_ABkixYvvAaQnbqDUQRhxOhfCXY7qKw8BjBtn/exec';
       const form = document.getElementById('waitlistForm');
       const status = document.getElementById('formStatus');
       
       if (form) {
         form.addEventListener('submit', async (e) => {
           e.preventDefault();
           const data = new FormData(form);
           
           const payload = {
             nombre: data.get('nombre'),
             email: data.get('email'),
             fecha: new Date().toISOString()
           };
       
           if (status) status.textContent = 'Enviando…';
       
           try {
             const params = new URLSearchParams();
             params.append('nombre', payload.nombre || '');
             params.append('email', payload.email || '');
             params.append('fecha', payload.fecha);
       
             await fetch(WAITLIST_ENDPOINT, {
               method: 'POST',
               mode: 'no-cors',
               headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
               body: params.toString()
             });
       
             form.reset();
             if (status) status.textContent = '¡Gracias por registrarte! Muy pronto recibirás noticias. ✨';
           } catch(err) {
             if (status) status.textContent = 'Hubo un problema. Intenta de nuevo o escríbeme a vane.zapata.ec@gmail.com';
           }
         });
       }
    </script>
</body>
</html>
